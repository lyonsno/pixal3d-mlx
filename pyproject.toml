[project]
name = "pixal3d-mlx"
version = "0.1.0"
description = "MLX-native Pixal3D (SIGGRAPH 2026) image-to-3D inference for Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.30",
    "numpy",
    "huggingface-hub",
    "safetensors",
    "pillow",
    "trimesh",
    "scipy",
    "scikit-image",
    "tqdm",
    "fast-simplification",
    "xatlas",
    "opencv-python",
    "rembg[cpu]",
    "moge-mlx @ git+https://github.com/lyonsno/moge-mlx.git",
]

[project.optional-dependencies]
dev = ["pytest"]
# PyTorch/MPS MoGe reference backend (--pytorch-moge flag):
#   pip install moge @ git+https://github.com/microsoft/MoGe.git
# NAF weight conversion (one-time): pip install torch safetensors

# Note: trellmlx package name is retained for import compatibility —
# the implementation reuses the trellis2mlx module structure intentionally.
[tool.setuptools.packages.find]
include = ["trellmlx*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
